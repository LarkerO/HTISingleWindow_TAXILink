services:
  webman:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_LISTEN: http://0.0.0.0:8787
      STREAM_LISTEN: websocket://0.0.0.0:8790
      MOD_LISTEN: websocket://0.0.0.0:8788
    volumes:
      - "./runtime:/app/runtime"
      - "./keys:/app/keys:ro"
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
      - "127.0.0.1:8790:8790"
    command: ["php", "start.php", "start" ]
